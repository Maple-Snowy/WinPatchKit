#  定位: 锚点 FUN_0055a900 入口 + SEH push 0x18667f
# =============================================================

[module]
id = "remove-nodog-startup-dialog"
version = "1.0.0"
name = "消除“未找到加密狗”启动弹窗"
target = "Teacher.exe"

[[module.patches]]
id    = "ret_entry"
where = { type = "anchor", pattern = "558bec6aff687f18", delta = 0 }
write = { type = "raw", bytes = "31c0c3", expect = "558bec" }