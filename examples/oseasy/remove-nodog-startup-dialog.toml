# =============================================================
#  02 消除“未找到加密狗”启动弹窗  [Teacher.exe]
#  源: OsEasyPatchTool.py SOLUTIONS key=nodog_dialog
#  目标: Teacher.exe  (MD5 7b999b972ea50b540c44800be1e4e465, 3732480 B)
#  原理: NOP 掉启动时按狗状态弹窗的分发函数 FUN_0055a900 入口。
#        入口改 xor eax,eax; ret。仅消除弹窗表象，不解除点数限制，
