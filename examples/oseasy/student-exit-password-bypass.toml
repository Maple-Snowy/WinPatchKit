# =============================================================
#  03 学生端退出密码恒通过  [Student.exe]
#  源: OsEasyPatchTool.py SOLUTIONS key=stu_exit_pwd (loc_type=multi, 单子 patch)
#  目标: Student.exe  (MD5 326a77edb4b5d03eaeeb7dafa2d9e08e, 2161152 B)
#  原理: 托盘/主页『退出』时要求输入密码（与 core.conf 里 Crypto++
#        密文比对）。本 patch 把总校验函数 FUN_004b5460 改为恒返回
#        『密码正确』(mov eax,1; ret)，随便输什么都能退出。
#  定位: 锚点含该函数独有 SEH 地址 0x56af1c，全文件唯一
# =============================================================

[module]
id = "student-exit-password-bypass"
version = "1.0.0"
name = "学生端退出密码恒通过"
target = "Student.exe"

[[module.patches]]
id    = "exit_pwd_always_true"
where = { type = "anchor", pattern = "558bec6aff681caf5600", delta = 0 }
write = { type = "raw", bytes = "b801000000c3", expect = "558bec6aff68" }