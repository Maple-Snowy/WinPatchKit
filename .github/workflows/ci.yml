name: CI

# push 自动触发（标题 = commit message）；workflow_dispatch 保留手动兜底。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支并发时取消旧的，省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Windows runner 默认 stdout 是 cp1252，打印中文会 UnicodeEncodeError。
# PYTHONUTF8=1 强制 Python 进入 UTF-8 模式（IO/文件系统编码全 UTF-8）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # 快速失败关卡：GUI import 校验
  # （patch 引擎单测 tests/test_winpatchkit.py 当前不在 CI 里执行，
  #  需要时本地直接 `python tests/test_winpatchkit.py` 跑）
  # 截图 job 依赖它，避免 GUI 有低级错误时白等渲染
  tests:
    name: GUI 导入校验
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: pwsh

      - name: GUI 模块导入校验（不渲染，仅 import + 控件树构造）
        run: |
          python -c "import gui.entry, gui.services, gui.pages.home, gui.pages.settings, gui.pages.import_page, gui.widgets.module_card, gui.widgets.report_view, gui.widgets.status_badge; print('GUI import OK')"
        shell: pwsh

  # 截图 job：真实渲染 GUI 并截图回传
  gui-screenshot:
    name: GUI 渲染截图
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: pwsh

      - name: 导入示例配置（让 GUI 主页有内容可显示）
        run: |
          python main.py import examples/example_demo.toml
        shell: pwsh

      - name: 启动 GUI 并截图
        shell: pwsh
        run: |
          # 60 秒后进程自动退出，确保 CI 不会挂住（窗口先渲染，截图在它关闭前完成）
          $env:WINPATCHKIT_GUI_AUTO_CLOSE_AFTER = "60"

          # 后台启动 GUI，记录进程，便于最后清理
          $proc = Start-Process -FilePath "python" -ArgumentList "main.py" `
                  -WorkingDirectory $PWD `
                  -PassThru -RedirectStandardOutput "gui_stdout.log" -RedirectStandardError "gui_stderr.log"
          Write-Host "GUI PID = $($proc.Id)"

          # 等窗口渲染（flet 首次启动会下载 client 并开窗口，给足时间）
          Write-Host "等待 30 秒让窗口渲染..."
          Start-Sleep -Seconds 30

          # 若进程已提前退出（渲染失败），打印日志并让 step 失败（避免假绿）
          if ($proc.HasExited) {
            Write-Host "!!! 进程已退出 (Code=$($proc.ExitCode))，dump 日志:"
            Write-Host "----- gui_stdout.log -----"; Get-Content gui_stdout.log -ErrorAction SilentlyContinue
            Write-Host "----- gui_stderr.log -----"; Get-Content gui_stderr.log -ErrorAction SilentlyContinue
            exit 1
          }

          # 把 GUI 窗口最大化（仅 CI 截图用，不影响项目代码默认窗口化）
          Add-Type -Type 'using System; using System.Runtime.InteropServices; public class Win32 { [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n); [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h); [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc lp, IntPtr l); [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n); [DllImport("user32.dll")] public static extern int GetWindowTextLength(IntPtr h); public delegate bool EnumWindowsProc(IntPtr h, IntPtr l); }'
          $hndls = New-Object System.Collections.ArrayList
          $cb = [Win32+EnumWindowsProc]{ param($h, $lparam)
              if ([Win32]::IsWindowVisible($h) -and [Win32]::GetWindowTextLength($h) -gt 0) {
                $sb = New-Object System.Text.StringBuilder([Win32]::GetWindowTextLength($h) + 1)
                [void][Win32]::GetWindowText($h, $sb, $sb.Capacity)
                if ($sb.ToString() -like '*WinPatchKit*') { [void]$hndls.Add($h) }
              }
              return $true }
          [void][Win32]::EnumWindows($cb, [IntPtr]::Zero)
          if ($hndls.Count -gt 0) {
            [void][Win32]::ShowWindow($hndls[0], 3)   # SW_MAXIMIZE = 3
            Start-Sleep -Seconds 3                     # 等最大化动画稳定
            Write-Host "已最大化窗口（匹配 $($hndls.Count) 个）"
          } else {
            Write-Host "!! 未找到 WinPatchKit 窗口，跳过最大化"
          }

          # 用 .NET 截整个虚拟屏
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $bmp.Save("gui_screenshot.png")
          $g.Dispose(); $bmp.Dispose()
          Write-Host "已保存 gui_screenshot.png (${screen.Width}x${screen.Height})"

          # 无论成败都清理 GUI 进程（若还没自动退出）
          if (-not $proc.HasExited) {
            try { Stop-Process -Id $proc.Id -Force } catch { }
          }

      - name: 上传截图（始终上传，便于失败时排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot
          path: |
            gui_screenshot.png
            gui_stdout.log
            gui_stderr.log
          if-no-files-found: warn
